name: Source checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow requests
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q audio_pipeline vision_pipeline/src reconstruction_pipeline
      - run: bash -n reconstruction_pipeline/setup.sh
